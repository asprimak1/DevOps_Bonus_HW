services:
  url-probe:
    build: .
    image: bonus-url-probe
    environment:
      PROBE_TIMEOUT: "6"
      PROBE_OUTPUT_DIR: /textfile
    volumes:
      - ./url-probe:/config:ro
      - textfile:/textfile
    restart: unless-stopped

  test-site:
    image: nginx:alpine
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --collector.textfile.directory=/textfile
    volumes:
      - textfile:/textfile:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped

volumes:
  textfile:
